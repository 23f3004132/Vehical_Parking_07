<!-- Register Page -->
<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>
    <div class="form-container">
    <h2>User Signup</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" placeholder="Enter your phone" required>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter your address" required>

        <label for="pin_code">Pin Code:</label>
        <input type="text" id="pin_code" name="pin_code" placeholder="Enter your pin code" required>

        <button type="submit">Register</button>

        <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-container">
            {% for message in messages %}
                <div class="flash-message">
                {{ message }}
                <span class="flash-close" onclick="this.parentElement.style.display='none';">&times;</span>
                </div>
            {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
    </form>
    </div>
</body>
</html>

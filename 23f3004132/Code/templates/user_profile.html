{% extends "user_base.html" %}

{% block content %}
<!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}"> -->

<div class="user-profile-container">
    <h2>User Profile</h2>
    <form method="POST" action="{{ url_for('user_profile') }}">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="{{ user.email }}" disabled>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter new password" required>
        </div>
        <div class="form-group">
            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>
        </div>
        <div class="form-group">
            <label for="phone">Pin Code:</label>
            <input type="text" id="pin_code" name="pin_code" value="{{ user.pin_code }}" required>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address" required>{{ user.address }}</textarea>
        </div>
        <div class="form-group">
            <button type="submit">Update Profile</button>
            <a href="{{ url_for('user_dashboard') }}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

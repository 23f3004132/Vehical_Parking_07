{% extends 'user_base.html' %}

{% block content %}
<div class="form-container">
    <h2>Book the Parking Spot</h2>
    <form method="POST">
        <label>User ID:</label>
        <input type="text" name="user_id" value="{{ session['user_id'] }}" readonly>
        
        <label>Lot Name:</label>
        <input type="text" name="lot_name" value="{{ lot.lot_name }}" readonly>

        <label>Spot ID:</label>
        <input type="text" name="spot_id" value="{{ spot.id }}" readonly>

        <label>Address:</label>
        <input type="text" name="address" value="{{ lot.address }}" readonly>

        <!-- for price -->
        <label>Price:</label>
        <input type="text" name="price" value="{{ lot.price_per_unit }}" readonly>

        <label>Vehicle Number:</label>
        <input type="text" name="vehicle_no" required>

        <div class="btn-group">
            <button type="submit" class="reserve-btn">Reserve</button>
            <a href="{{ url_for('user_dashboard') }}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

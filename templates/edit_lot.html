{% extends 'admin_base.html' %}

{% block content %}
 <h2>Edit Parking Lot</h2>
    <form method="POST">
        <label>Location Name:</label><br>
        <input type="text" name="location_name" value="{{ lot.location_name }}" required><br><br>
        
        <label>Address:</label><br>
        <input type="text" name="address" value="{{ lot.address }}" required><br><br>
        
        <label>Pin Code:</label><br>
        <input type="text" name="pin_code" value="{{ lot.pin_code }}" required><br><br>
        
        <label>Price per Unit:</label><br>
        <input type="number" step="0.01" name="price_per_unit" value="{{ lot.price_per_unit }}" required><br><br>
        
        <label>Total Spots:</label><br>
        <input type="number" name="total_spots" value="{{ lot.total_spots }}" required><br><br>
        
        <button type="submit">Update</button>
    </form>
{% endblock %}

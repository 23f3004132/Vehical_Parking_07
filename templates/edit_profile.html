{% extends "admin_base.html" %}
{% block content %}
<div class="edit-profile-container">
    <h2>Edit Profile</h2>
    <form method="POST">
        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" id="full_name" value="{{ user.full_name }}" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="{{ user.email }}" required>

        <label for="address">Address</label>
        <input type="text" name="address" id="address" value="{{ user.address }}" required>

        <label for="pin_code">Pin Code</label>
        <input type="text" name="pin_code" id="pin_code" value="{{ user.pin_code }}" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" value="{{ user.password }}" required>

        <button type="submit" class="save-btn">Save Changes</button>
        <a href="{{ url_for('admin_dashboard') }}" class="cancel-btn">Cancel</a>
    </form>
</div>
{% endblock %}

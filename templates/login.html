<!-- login page -->
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Vehicle Parking System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>
    <div class="header">
        <h1 style = 'color: #004080; text-align: center;'>Vehicle Parking System</h1>
    </div>
    <div class="login-container">
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="full_name">Username:</label>
                <input type="email" id="full_name" name="full_name" placeholder="@study.iitm.ac.in" required>   
            </div>
            <div class="form-group">        
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group" style="display: flex; flex-direction: column; align-items: center;">
                <button class="login-button" type="submit">Login</button>
                <br>
                <a class="register-link" href="{{ url_for('register') }}">Register</a>
            </div>
            <div class="error-message">
                {{msg}}
            </div>
            <p style="color: green;"> {{success}} </p>  
        </form>
    </div>
</body>
</html>

<!-- login page -->
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Vehicle Parking System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>
    <div class="header">
        <h1 style = 'color: #004080; text-align: center;'>Vehicle Parking System</h1>
    </div>
    <div class="form-container">
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="full_name">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>   
            </div>
            <div class="form-group">        
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your Password" required>
            </div>
            <div class="form-group" style="display: flex; flex-direction: column; align-items: center;">
                <button class="login-button" type="submit">Login</button>
                <br>
                <a class="register-link" href="{{ url_for('register') }}">Register</a>
            </div>
            
        </form>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-container">
            {% for message in messages %}
                <div class="flash-message">
                {{ message }}
                <span class="flash-close" onclick="this.parentElement.style.display='none';">&times;</span>
                </div>
            {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
    </div>
</body>
</html>

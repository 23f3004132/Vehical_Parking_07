{% extends 'user_base.html' %}

{% block content %}
<div class="container mt-4">
    <h3 class="text-center text-warning mb-4">Release the Parking Spot</h3>
    <form method="POST">
        <div class="form-group">
            <label>Spot ID:</label>
            <input type="text" class="form-control" value="{{ reservation.spot_id }}" readonly>
        </div>
        <div class="form-group">
            <label>Vehicle Number:</label>
            <input type="text" class="form-control" value="{{ reservation.vehicle_number }}" readonly>
        </div>
        <div class="form-group">
            <label>Parking Time:</label>
            <input type="text" class="form-control" value="{{ reservation.parking_time.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
        </div>
        <div class="form-group">
            <label>Releasing Time:</label>
            <input type="text" class="form-control" value="{{ leaving_time }}" readonly>
        </div>
        <div class="form-group">
            <label>Total Cost:</label>
            <input type="text" class="form-control" value="₹ {{ total_cost  }}" readonly>
        </div>
        <div class="text-center mt-4">
            <button type="submit">Release</button>
            <a href="{{ url_for('user_dashboard') }}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'admin_base.html' %}

{% block content %}
<h2 style="color: #004080; text-align: center;">View/Delete Parking Spot</h2>

<div class="form-container">
    <form method="POST">
        <label>ID:</label>
        <input type="text" value="{{ spot.id }}" readonly>

        <label>Status:</label>
        <input type="text" value="{{ spot.status }}" readonly>

        {% if spot.status == 'O' %}
            <p style="color: red;">Occupied spots cannot be deleted.</p>
            <a href="{{ url_for('view_reservation_details', spot_id=spot.id) }}" class="btn">View Reservation Details</a>
        {% else %}
            <button type="submit" name="action" value="delete">Delete</button>
        {% endif %}
        
        <a href="{{ url_for('admin_dashboard') }}" class="btn cancel-btn">Close</a>
    </form>
</div>
{% endblock %}
